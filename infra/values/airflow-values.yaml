# Airflow Helm Chart Values
# Apache Airflow with KubernetesExecutor

# Executor configuration - KubernetesExecutor for pod-based tasks
executor: KubernetesExecutor

# Airflow image with our dependencies
images:
  airflow:
    repository: apache/airflow
    tag: "3.0.2-python3.11"

# Fernet key for encryption
fernetKey: ${airflow_fernet_key}

# Airflow configuration
config:
  core:
    load_examples: "False"
  kubernetes_executor:
    namespace: ${airflow_namespace}
    worker_container_repository: apache/airflow
    worker_container_tag: "3.0.2-python3.11"
    delete_worker_pods: "True"
    delete_worker_pods_on_failure: "False"

# DAGs configuration - using configmap
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

workers:
  extraVolumes:
    - name: dags-volume
      configMap:
        name: ${dags_configmap_name}
    - name: geopipeline-configmap
      configMap:
        name: ${geopipeline_configmap_name}
    - name: geopipeline-package
      emptyDir: {}

  extraVolumeMounts:
    - name: dags-volume
      mountPath: /opt/airflow/dags/satellite_ingestion_dag.py
      subPath: satellite_ingestion_dag.py
      readOnly: true
    - name: dags-volume
      mountPath: /opt/airflow/dags/field_processing_dag.py
      subPath: field_processing_dag.py
      readOnly: true
    - name: geopipeline-package
      mountPath: /opt/airflow/geopipeline
      readOnly: false

  extraInitContainers:
    - name: init-geopipeline
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          mkdir -p /opt/airflow/geopipeline/generators
          mkdir -p /opt/airflow/geopipeline/clients
          mkdir -p /opt/airflow/geopipeline/services
          cp /src/__init__.py /opt/airflow/geopipeline/__init__.py
          cp /src/config.py /opt/airflow/geopipeline/config.py
          cp /src/generators___init__.py /opt/airflow/geopipeline/generators/__init__.py
          cp /src/generators__satellite_data.py /opt/airflow/geopipeline/generators/satellite_data.py
          cp /src/generators__field_data.py /opt/airflow/geopipeline/generators/field_data.py
          cp /src/clients___init__.py /opt/airflow/geopipeline/clients/__init__.py
          cp /src/clients__storage.py /opt/airflow/geopipeline/clients/storage.py
          cp /src/services___init__.py /opt/airflow/geopipeline/services/__init__.py
          cp /src/services__ingestion.py /opt/airflow/geopipeline/services/ingestion.py
          cp /src/services__processing.py /opt/airflow/geopipeline/services/processing.py
      volumeMounts:
        - name: geopipeline-configmap
          mountPath: /src
          readOnly: true
        - name: geopipeline-package
          mountPath: /opt/airflow/geopipeline

# Environment variables for MinIO connection (applied to all components)
env:
  - name: MINIO_ENDPOINT
    value: ${minio_endpoint}
  - name: MINIO_ACCESS_KEY
    value: ${minio_access_key}
  - name: MINIO_SECRET_KEY
    value: ${minio_secret_key}
  - name: RAW_BUCKET
    value: raw-imagery
  - name: PROCESSED_BUCKET
    value: processed-data
  - name: PYTHONPATH
    value: /opt/airflow

# ============================================================
# COMPONENT-SCOPED VOLUMES AND INIT CONTAINERS
# Each component needs its own volumes/mounts/init containers
# ============================================================

# Scheduler configuration
scheduler:
  extraVolumes:
    - name: dags-volume
      configMap:
        name: ${dags_configmap_name}
    - name: geopipeline-configmap
      configMap:
        name: ${geopipeline_configmap_name}
    - name: geopipeline-package
      emptyDir: {}

  extraVolumeMounts:
    - name: dags-volume
      mountPath: /opt/airflow/dags/satellite_ingestion_dag.py
      subPath: satellite_ingestion_dag.py
      readOnly: true
    - name: dags-volume
      mountPath: /opt/airflow/dags/field_processing_dag.py
      subPath: field_processing_dag.py
      readOnly: true
    - name: geopipeline-package
      mountPath: /opt/airflow/geopipeline
      readOnly: false

  extraInitContainers:
    - name: init-geopipeline
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "Initializing geopipeline package structure..."
          mkdir -p /opt/airflow/geopipeline/generators
          mkdir -p /opt/airflow/geopipeline/clients
          mkdir -p /opt/airflow/geopipeline/services
          cp /src/__init__.py /opt/airflow/geopipeline/__init__.py
          cp /src/config.py /opt/airflow/geopipeline/config.py
          cp /src/generators___init__.py /opt/airflow/geopipeline/generators/__init__.py
          cp /src/generators__satellite_data.py /opt/airflow/geopipeline/generators/satellite_data.py
          cp /src/generators__field_data.py /opt/airflow/geopipeline/generators/field_data.py
          cp /src/clients___init__.py /opt/airflow/geopipeline/clients/__init__.py
          cp /src/clients__storage.py /opt/airflow/geopipeline/clients/storage.py
          cp /src/services___init__.py /opt/airflow/geopipeline/services/__init__.py
          cp /src/services__ingestion.py /opt/airflow/geopipeline/services/ingestion.py
          cp /src/services__processing.py /opt/airflow/geopipeline/services/processing.py
          echo "Package structure initialized successfully"
      volumeMounts:
        - name: geopipeline-configmap
          mountPath: /src
          readOnly: true
        - name: geopipeline-package
          mountPath: /opt/airflow/geopipeline

