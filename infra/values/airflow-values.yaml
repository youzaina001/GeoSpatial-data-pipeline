# PostgreSQL for metadata
postgresql:
  enabled: true
  image:
    tag: latest

# Enable database migration job
migrateDatabaseJob:
  enabled: true

# Redis disabled (not needed for KubernetesExecutor)
redis:
  enabled: false

# Disable flower (not needed)
flower:
  enabled: false
