[project]
name = "geocrawl"
version = "0.1.0"
description = "Crawl freshness: how much new prose a later web crawl adds to a candidate training corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "selectolax>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
geocrawl = "geocrawl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
