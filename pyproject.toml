[project]
name = "hydrosat-technical-test"
version = "0.1.0"
description = "Geospatial data pipeline with Airflow on Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=2.8.0",
    "boto3>=1.34.0",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto[s3]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrosat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
